services:
  # ========================================================
  # OPSI 1: Standalone Single Binary (Bertenaga SQLite WAL)
  # Sangat hemat RAM (< 40MB), zero dependency, super cepat
  # ========================================================
  mailserver-sqlite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rahamail_sqlite_app
    restart: unless-stopped
    ports:
      - "8080:8080" # Web Dashboard UI & REST API
      - "25:25"     # SMTP Inbound Port 25
      - "587:587"   # SMTP Submission Port 587
      - "143:143"   # IMAP Server Port 143
      - "993:993"   # IMAPS
    environment:
      - DB_DRIVER=sqlite
      - SQLITE_PATH=/app/data/rahamail.db
      - GIN_MODE=release
      - PORT=:8080
      - SMTP_PORT=:25
      - IMAP_PORT=:143
    volumes:
      - sqlite_data:/app/data
      - mail_storage:/app/var/mail

  # ========================================================
  # OPSI 2 (Opsional): Jika ingin menggunakan PostgreSQL
  # Aktifkan service postgres di bawah dan ganti DB_DRIVER=postgres
  # ========================================================
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: gomail_postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: gomail
  #     POSTGRES_PASSWORD: gomail_password_secret
  #     POSTGRES_DB: gomail_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

volumes:
  sqlite_data:
  mail_storage:
  # postgres_data:
